<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="校园跑——基于 Spring Boot 的校园跑腿系统">
    <title>校园跑 · 让每一次顺路都有意义</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">
<div class="auth-shell">
    <section class="auth-hero">
        <div class="hero-glow hero-glow-a"></div>
        <div class="hero-glow hero-glow-b"></div>
        <header class="auth-brand">
            <span class="brand-mark" id="brandMark"></span>
            <span class="brand-name">校园跑<span class="brand-dot">.</span></span>
        </header>

        <div class="hero-copy">
            <span class="eyebrow"><span class="eyebrow-dot"></span> CAMPUS ERRAND · 校园互助</span>
            <h1>让每一次<br><em>顺路</em>，都变成帮助。</h1>
            <p class="hero-sub">取快递、带饭、打印、代购——把琐事交给顺路的同学，<br class="desktop-only">用一杯奶茶的时间，换彼此一个轻松的下午。</p>
            <div class="hero-actions">
                <a class="hero-link" href="#login" data-auth-tab="register">创建账号 <span>→</span></a>
                <span class="hero-note">已服务 <b id="heroOrders">—</b> 次校园互助</span>
            </div>
        </div>

        <div class="route-art" aria-hidden="true">
            <svg viewBox="0 0 620 230" fill="none">
                <path d="M20 190C98 190 90 60 178 60C266 60 260 160 350 160C440 160 430 48 600 48"
                      stroke="rgba(255,255,255,.42)" stroke-width="2" stroke-dasharray="7 9"/>
                <circle cx="20" cy="190" r="7" fill="#f2a93b"/>
                <circle cx="178" cy="60" r="7" fill="#f2a93b"/>
                <circle cx="350" cy="160" r="7" fill="#f2a93b"/>
                <circle cx="600" cy="48" r="9" fill="#fff"/>
                <circle cx="600" cy="48" r="17" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
            </svg>
            <div class="route-bubble route-bubble-a"><span>📦</span><div><b>快递已送达</b><small>6 号宿舍楼 · 3 分钟前</small></div></div>
            <div class="route-bubble route-bubble-b"><span>🍜</span><div><b>顺路带份午饭</b><small>一食堂 → 图书馆</small></div></div>
        </div>

        <div class="hero-stats">
            <div class="hero-stat"><strong id="statUsers">—</strong><span>注册同学</span></div>
            <div class="hero-stat"><strong id="statRate">—<i>%</i></strong><span>订单完成率</span></div>
            <div class="hero-stat"><strong id="statCompleted">—</strong><span>已完成互助</span></div>
        </div>
        <p class="hero-foot">校园之内 · 实名认证 · 资金托管 · 安全可追溯</p>
    </section>

    <section class="auth-panel" id="login">
        <div class="auth-panel-top">
            <span class="mobile-brand"><span class="brand-mark" id="brandMarkMobile"></span> 校园跑</span>
            <span class="auth-help">遇到问题？<a href="#" onclick="return false;">联系校园服务站</a></span>
        </div>

        <div class="auth-card">
            <div class="auth-tabs" role="tablist">
                <button class="auth-tab active" data-tab="login" type="button">登录</button>
                <button class="auth-tab" data-tab="register" type="button">注册</button>
                <span class="auth-tab-ink" id="authTabInk"></span>
            </div>

            <div class="auth-heading">
                <h2 id="authTitle">欢迎回来</h2>
                <p id="authSubtitle">登录后继续你的校园互助</p>
            </div>

            <form id="loginForm" class="auth-form" autocomplete="on">
                <label class="field">
                    <span class="field-label">账号</span>
                    <span class="input-wrap"><span class="input-icon" data-icon="user"></span>
                        <input class="input" id="loginUsername" name="username" placeholder="请输入用户名" autocomplete="username" required>
                    </span>
                </label>
                <label class="field">
                    <span class="field-label">密码 <a class="field-link" href="#" onclick="return false;">忘记密码？</a></span>
                    <span class="input-wrap"><span class="input-icon" data-icon="lock"></span>
                        <input class="input" id="loginPassword" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
                        <button class="pwd-toggle" type="button" data-pwd="loginPassword" aria-label="显示密码">显示</button>
                    </span>
                </label>
                <div class="form-error" id="loginError"></div>
                <button class="btn btn-primary btn-lg btn-block" id="loginBtn" type="submit">进入校园跑 →</button>
            </form>

            <form id="registerForm" class="auth-form hidden" autocomplete="on">
                <div class="form-grid-2">
                    <label class="field">
                        <span class="field-label">用户名</span>
                        <span class="input-wrap"><span class="input-icon" data-icon="user"></span>
                            <input class="input" id="regUsername" placeholder="4-20 位字母或数字" autocomplete="username" required>
                        </span>
                    </label>
                    <label class="field">
                        <span class="field-label">昵称</span>
                        <span class="input-wrap"><span class="input-icon" data-icon="smile"></span>
                            <input class="input" id="regNickname" placeholder="同学们怎么称呼你" required>
                        </span>
                    </label>
                </div>
                <label class="field">
                    <span class="field-label">手机号</span>
                    <span class="input-wrap"><span class="input-icon" data-icon="phone"></span>
                        <input class="input" id="regPhone" placeholder="用于订单联系，仅对交易双方可见" inputmode="numeric" required>
                    </span>
                </label>
                <label class="field">
                    <span class="field-label">密码</span>
                    <span class="input-wrap"><span class="input-icon" data-icon="lock"></span>
                        <input class="input" id="regPassword" type="password" placeholder="6-20 位，建议字母 + 数字" autocomplete="new-password" required>
                        <button class="pwd-toggle" type="button" data-pwd="regPassword" aria-label="显示密码">显示</button>
                    </span>
                </label>
                <label class="checkline">
                    <input type="checkbox" id="regAgree" checked>
                    <span>我已阅读并同意《校园跑服务协议》与《隐私说明》</span>
                </label>
                <div class="form-error" id="registerError"></div>
                <button class="btn btn-primary btn-lg btn-block" id="registerBtn" type="submit">创建账号 →</button>
            </form>

            <div class="demo-box">
                <div class="demo-title"><span>演示账号</span><small>点击一键填入</small></div>
                <div class="demo-chips">
                    <button type="button" class="demo-chip" data-user="student1" data-pass="123456"><b>陈同学</b><span>发布者</span></button>
                    <button type="button" class="demo-chip" data-user="runner1" data-pass="123456"><b>阿凯</b><span>跑腿员</span></button>
                    <button type="button" class="demo-chip" data-user="admin" data-pass="admin123"><b>管理员</b><span>后台</span></button>
                </div>
            </div>
        </div>

        <p class="auth-copyright">© 2026 CampusRun · 软件工程毕业设计作品</p>
    </section>
</div>

<div id="toastRoot" class="toast-root"></div>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
