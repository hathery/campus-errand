server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: campus-errand
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 5MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # 演示密钥，生产环境务必通过环境变量 APP_JWT_SECRET 替换
    secret: ${APP_JWT_SECRET:Y2FtcHVzLWVycmFuZC1qd3Qtc2VjcmV0LWtleS0yMDI2LXNwcmluZy1ib290LXNlY3VyaXR5}
    expiration-minutes: 1440
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  demo-data: ${APP_DEMO_DATA:true}
  cors-allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080

logging:
  level:
    com.campus.errand: info
